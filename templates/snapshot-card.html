<div class="pas-card" data-snapshot-id="{{id}}">
    <div class="pas-card-main">
        <div class="pas-card-title">
            <i class="fa-solid fa-circle pas-card-icon"></i>
            <span class="pas-card-name">{{presetName}}</span>
            {{#if isCurrent}}
                <span class="pas-tag pas-tag-current">当前</span>
            {{/if}}
        </div>
        <div class="pas-card-meta">
            <span class="pas-card-time">{{time}}</span>
            <span class="pas-divider">·</span>
            <span class="pas-tag pas-tag-{{trigger}}">{{triggerLabel}}</span>
        </div>
    </div>
    <div class="pas-card-actions">
        <button class="pas-btn-restore" data-id="{{id}}" title="恢复">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button class="pas-btn-view" data-id="{{id}}" title="查看">
            <i class="fa-solid fa-eye"></i>
        </button>
        <button class="pas-btn-delete" data-id="{{id}}" title="删除">
            <i class="fa-solid fa-trash"></i>
        </button>
    </div>
</div>
