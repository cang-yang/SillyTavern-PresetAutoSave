<div class="pas-settings">
    <div class="pas-setting-item">
        <label class="pas-setting-label">
            <span data-i18n="Enable Auto Save">启用自动保存</span>
            <small data-i18n="Master switch">总开关</small>
        </label>
        <label class="checkbox_label">
            <input type="checkbox" data-setting="enabled" {{#if settings.enabled}}checked{{/if}}>
        </label>
    </div>

    <div class="pas-setting-item">
        <label class="pas-setting-label">
            <span data-i18n="Debounce Delay">防抖延迟 (ms)</span>
            <small>修改后多久触发保存</small>
        </label>
        <input type="number" class="text_pole" data-setting="debounceMs"
               value="{{settings.debounceMs}}" min="100" max="10000" step="100">
    </div>

    <div class="pas-setting-item">
        <label class="pas-setting-label">
            <span data-i18n="Max History Per Preset">每个预设保留条数</span>
            <small>超出后自动删除最旧的</small>
        </label>
        <input type="number" class="text_pole" data-setting="maxHistoryPerPreset"
               value="{{settings.maxHistoryPerPreset}}" min="5" max="500" step="5">
    </div>

    <div class="pas-setting-item">
        <label class="pas-setting-label">
            <span data-i18n="Switch Guard">切换保护</span>
            <small>切换预设前自动备份</small>
        </label>
        <label class="checkbox_label">
            <input type="checkbox" data-setting="enableSwitchGuard"
                   {{#if settings.enableSwitchGuard}}checked{{/if}}>
        </label>
    </div>

    <div class="pas-setting-item">
        <label class="pas-setting-label">
            <span data-i18n="Status Indicator">显示状态指示器</span>
            <small>预设名旁的小圆点</small>
        </label>
        <label class="checkbox_label">
            <input type="checkbox" data-setting="showStatusIndicator"
                   {{#if settings.showStatusIndicator}}checked{{/if}}>
        </label>
    </div>

    <div class="pas-setting-item">
        <label class="pas-setting-label">
            <span data-i18n="Notify On Save">保存时提示</span>
            <small>每次自动保存显示Toast</small>
        </label>
        <label class="checkbox_label">
            <input type="checkbox" data-setting="notifyOnSave"
                   {{#if settings.notifyOnSave}}checked{{/if}}>
        </label>
    </div>

    <div class="pas-settings-actions">
        <button class="pas-btn-reset menu_button">
            <i class="fa-solid fa-rotate-right"></i>
            <span data-i18n="Reset Defaults">恢复默认</span>
        </button>
        <button class="pas-btn-clear-all menu_button caution">
            <i class="fa-solid fa-trash"></i>
            <span data-i18n="Clear All">清空所有历史</span>
        </button>
    </div>
</div>
